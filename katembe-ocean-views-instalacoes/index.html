<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Katembe Ocean Views · Instalações</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="vendor/core.css">
<link rel="stylesheet" href="vendor/markers.css">
<style>
:root{--ink:#f6f1e8;--mute:rgba(246,241,232,.68);--glass:rgba(22,18,14,.62);--line:rgba(246,241,232,.2);--gold:#d8b27a;--dot:#7fd18c}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#14110e;color:var(--ink);font:400 15px/1.35 Jost,system-ui,sans-serif;overflow:hidden}
#view{position:fixed;inset:0}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
.glass{background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:14px}
#top{position:fixed;left:16px;top:16px;z-index:20;padding:10px 16px;pointer-events:none}
#top b{display:block;font-weight:500;letter-spacing:.14em;font-size:12px;text-transform:uppercase;color:var(--gold)}
#room{font-size:21px;font-weight:300}
#note{font-size:12px;color:var(--mute)}
#bar{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:20;display:flex;align-items:center;gap:2px;padding:4px}
#bar button{min-width:44px;height:44px;padding:0 12px;border-radius:10px;white-space:nowrap}
#bar button:hover,#bar button[aria-pressed=true]{background:rgba(246,241,232,.14)}
#count{white-space:nowrap;padding:0 8px;color:var(--mute);font-variant-numeric:tabular-nums;min-width:56px;text-align:center}
#side{position:fixed;right:16px;top:16px;bottom:84px;width:270px;z-index:21;display:none;flex-direction:column;overflow:hidden}
#side.open{display:flex}
#zhead{display:flex;align-items:center;gap:8px;min-height:48px;padding:0 10px;border-bottom:1px solid var(--line)}
#zhead b{font-weight:500;letter-spacing:.12em;font-size:12px;text-transform:uppercase;color:var(--gold)}
#zback{height:36px;padding:0 10px;border-radius:8px;color:var(--ink);background:rgba(246,241,232,.1)}
#zones{flex:1;overflow:auto;padding:6px}
#zones button{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;padding:12px;border-radius:10px;min-height:52px;font-size:16px}
#zones button:hover{background:rgba(246,241,232,.1)}
#zones button.on{background:rgba(216,178,122,.28)}
#zones small{color:var(--mute);font-size:12px}
#mapw{flex:0 0 auto;background:#efe9dd;display:flex;justify-content:center}
#mapin{position:relative;height:38vh;max-width:100%}
#mapin img{display:block;height:100%;width:100%}
#dots{position:absolute;inset:0}
.d{position:absolute;width:14px;height:14px;margin:-7px;border-radius:50%;background:var(--dot);border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.5)}
.d.on{background:var(--gold);transform:scale(1.35)}
#list{flex:1;overflow:auto;padding:6px}
#list button{display:block;width:100%;text-align:left;padding:9px 10px;border-radius:8px;min-height:40px}
#list button:hover{background:rgba(246,241,232,.1)}
#list button.on{background:rgba(216,178,122,.28)}
.hs{display:flex;align-items:center;gap:8px;cursor:pointer;transform:translateX(-14px);white-space:nowrap}
.hs i{width:28px;height:28px;border-radius:50%;border:2px solid #fff;background:rgba(255,255,255,.28);box-shadow:0 2px 10px rgba(0,0,0,.45);backdrop-filter:blur(3px);position:relative}
.hs i:after{content:"";position:absolute;inset:7px;border-radius:50%;background:#fff}
.hs span{padding:4px 10px;border-radius:99px;background:var(--glass);color:var(--ink);font:400 13px Jost,sans-serif}
#intro{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:0 16px 14vh;text-align:center;background:linear-gradient(180deg,rgba(20,17,14,.05) 45%,rgba(20,17,14,.72));transition:opacity .7s}
#intro.hide{opacity:0;pointer-events:none}
#intro h1{margin:0;font-weight:300;font-size:clamp(44px,9vw,92px);letter-spacing:.02em;text-shadow:0 2px 30px rgba(0,0,0,.45)}
#intro p{margin:6px 0 24px;color:var(--ink);text-shadow:0 1px 12px rgba(0,0,0,.6)}
#enter{height:50px;padding:0 30px;border-radius:99px;background:var(--ink);color:#1c1712;font-weight:500}
.psv-loader{color:var(--gold)!important}
@media(max-width:700px){#side{left:16px;right:16px;width:auto;top:148px}#room{font-size:18px}#bar button{padding:0 9px}.lbl{display:none}}
</style>
<script type="importmap">{"imports":{"three":"./vendor/three.js","@photo-sphere-viewer/core":"./vendor/core.js"}}</script>
</head>
<body>
<div id="view"></div>
<div id="top" class="glass"><b id="brand"></b><div id="room"></div><div id="note"></div></div>
<div id="bar" class="glass">
<button id="prev" aria-label="Anterior">‹</button><div id="count"></div><button id="next" aria-label="Seguinte">›</button>
<button id="play" aria-pressed="false">▶ <span class="lbl" id="lTour"></span></button>
<button id="menu" aria-pressed="false">☰ <span class="lbl" id="lRooms"></span></button>
</div>
<aside id="side" class="glass">
<div id="zhead"><button id="zback" aria-label="Voltar às zonas">‹ Zonas</button><b id="ztitle"></b></div><div id="zones"></div>
<div id="mapw"><div id="mapin"><img id="map" alt="Plan"><div id="dots"></div></div></div>
<div id="list"></div>
</aside>
<div id="intro"><h1 id="iTitle"></h1><p id="iSub"></p><button id="enter"></button></div>
<script type="module">
import {Viewer} from '@photo-sphere-viewer/core';
import {MarkersPlugin} from './vendor/markers.js';
import {VisibleRangePlugin} from './vendor/range.js';
const {meta:C,rooms:R}=await (await fetch('tour.json')).json(), byId=Object.fromEntries(R.map(r=>[r.id,r])), $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
$('#brand').textContent=C.title;$('#note').textContent=C.note;$('#lTour').textContent=C.tourLabel;$('#lRooms').textContent=C.roomsLabel;$('#iTitle').textContent=C.title;$('#iSub').textContent=C.subtitle;$('#enter').textContent=C.enter;
let zmode='zones';
C.tabs.forEach(t=>{const n=R.filter(r=>r.tab===t.id).length,b=document.createElement('button');b.dataset.f=t.id;b.innerHTML=`<span>${esc(t.label)}</span><small>${n} ${n===1?'espaço':'espaços'} ›</small>`;b.onclick=()=>{tab=t.id;zmode='rooms';ui()};$('#zones').append(b)});
$('#zback').onclick=()=>{zmode='zones';ui()};
const img=id=>`img/${id}.jpg`;
let cur=byId[location.hash.slice(1)]||R[0], tab=cur.tab, busy=false, auto=false, autoT=0;
const v=new Viewer({container:'view',panorama:img(cur.id),navbar:false,defaultZoomLvl:15,defaultYaw:cur.startYaw,defaultPitch:0,touchmoveTwoFingers:false,mousewheelCtrlKey:false,loadingTxt:'A abrir',
  plugins:[[MarkersPlugin,{}],[VisibleRangePlugin,{verticalRange:[-1.22,1.3]}]]});
const M=v.getPlugin(MarkersPlugin);
function marks(r){M.setMarkers(r.hs.map((h,i)=>({id:'h'+i,position:{yaw:h.yaw,pitch:h.pitch},html:`<div class="hs"><i></i><span>${esc(h.label)}</span></div>`,anchor:'center left',size:{width:220,height:30},data:{to:h.to}})))}
function ui(){
  $('#room').textContent=cur.name; $('#count').textContent=`${R.indexOf(cur)+1} / ${R.length}`;
  const Z=C.tabs.find(t=>t.id===tab), zl=zmode==='zones';
  $('#zones').style.display=zl?'':'none'; $('#list').style.display=zl?'none':''; $('#zback').style.display=zl?'none':'';
  $('#ztitle').textContent=zl?C.roomsLabel:(Z?Z.label:'');
  document.querySelectorAll('#zones button').forEach(b=>b.classList.toggle('on',b.dataset.f===cur.tab));
  const list=R.filter(r=>r.tab===tab); $('#list').innerHTML='';
  list.forEach(r=>{const b=document.createElement('button');b.textContent=r.name.replace(/^[^:]+:\s*/,'').replace(/^./,c=>c.toUpperCase());if(r===cur)b.className='on';b.onclick=()=>go(r.id);$('#list').append(b)});
  if(zl){$('#mapw').style.display='none';return}
  const pl=C.tabs.find(t=>t.id===tab)?.plan, P=C.plans[pl]; $('#mapw').style.display=P?'':'none'; $('#dots').innerHTML=''; if(!P)return; $('#map').src=`img/${P.file}`; const w=P.w,h=P.h; $('#mapin').style.aspectRatio=w+'/'+h;
  R.filter(r=>r.plan===pl&&r.tab===tab).forEach(r=>{const d=document.createElement('button');d.className='d'+(r===cur?' on':'');d.style.left=r.px/w*100+'%';d.style.top=r.py/h*100+'%';d.title=r.name;d.setAttribute('aria-label',r.name);d.onclick=()=>go(r.id);$('#dots').append(d)});
}
async function go(id,keep){
  if(busy||id===cur.id&&!keep)return; busy=true; cur=byId[id]; tab=cur.tab; zmode='rooms'; history.replaceState(0,'','#'+id); M.clearMarkers(); ui();
  await v.setPanorama(img(id),{position:{yaw:cur.startYaw,pitch:0},zoom:15,transition:800,showLoader:false}); marks(cur); busy=false; preload(cur);
}
function preload(r){r.hs.forEach(h=>{new Image().src=img(h.to)})}
const step=n=>go(R[(R.indexOf(cur)+n+R.length)%R.length].id);
M.addEventListener('select-marker',e=>go(e.marker.data.to));
v.addEventListener('ready',()=>{marks(cur);ui();preload(cur);requestAnimationFrame(tick)},{once:true});
let last=0;function tick(t){const dt=(t-last)/1000;last=t;if(auto&&!busy&&dt<1){v.rotate({yaw:v.getPosition().yaw+dt*.22,pitch:0});autoT+=dt;if(autoT>11){autoT=0;step(1)}}requestAnimationFrame(tick)}
$('#prev').onclick=()=>step(-1);$('#next').onclick=()=>step(1);
const pa=$('#play');pa.onclick=()=>{auto=!auto;autoT=0;pa.setAttribute('aria-pressed',auto)};
const me=$('#menu');me.onclick=()=>{const o=$('#side').classList.toggle('open');me.setAttribute('aria-pressed',o);if(o){zmode='zones';ui()}};
$('#enter').onclick=()=>{$('#intro').classList.add('hide');$('#side').classList.add('open');me.setAttribute('aria-pressed',true);zmode='zones';ui()};
if(location.hash)$('#intro').classList.add('hide');
addEventListener('hashchange',()=>{const k=location.hash.slice(1);if(byId[k]&&k!==cur.id)go(k);$('#intro').classList.add('hide')});
addEventListener('keydown',e=>{if(e.key==='ArrowRight')step(1);if(e.key==='ArrowLeft')step(-1)});
window.__tour={v,go,R};
</script>
</body>
</html>
