<style>
/* Layout: full bleed 3D canvas, a quiet top bar with the level picker, a room index on the left (bottom sheet on phones) */
:root{
  --bg:#eef0ec; --panel:rgba(250,250,247,.94); --ink:#1f2622; --muted:#66706a; --line:#d7dbd4;
  --accent:#8a5a32; --accent-ink:#fff; --chip:#e4e7e1; --hi:#f0e3d2;
  --sans:"Figtree",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"DM Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141816; --panel:rgba(26,31,28,.93); --ink:#e8ebe6; --muted:#9aa49d; --line:#323a35; --accent:#c99460; --accent-ink:#1a120a; --chip:#262d29; --hi:#3a2e22; color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141816; --panel:rgba(26,31,28,.93); --ink:#e8ebe6; --muted:#9aa49d; --line:#323a35; --accent:#c99460; --accent-ink:#1a120a; --chip:#262d29; --hi:#3a2e22; color-scheme:dark}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);overflow:hidden;font-size:14px}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
button{font:inherit;color:inherit}
.bar{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;display:flex;gap:10px;align-items:center;flex-wrap:wrap;
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none;z-index:5}
.bar>*{pointer-events:auto}
.brand{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:7px 12px;display:flex;flex-direction:column;line-height:1.15;backdrop-filter:blur(8px)}
.brand b{font-weight:700;letter-spacing:.01em;font-size:15px}
.brand span{font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px;backdrop-filter:blur(8px);flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:6px 10px;border-radius:7px;cursor:pointer;font-weight:500;font-size:13px;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.seg button:focus-visible,.tg:focus-within,.room:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.spacer{flex:1}
#panel{position:fixed;left:max(16px,env(safe-area-inset-left,0px));top:calc(env(safe-area-inset-top,0px) + 70px);bottom:calc(env(safe-area-inset-bottom,0px) + 16px);width:290px;
  background:var(--panel);border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;z-index:4;backdrop-filter:blur(8px);min-height:0}
#panel header{padding:12px 12px 8px;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--line)}
#panel h2{margin:0;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;display:flex;justify-content:space-between}
#q{width:100%;box-sizing:border-box;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:7px 9px;font:inherit}
#list{overflow:auto;padding:4px 6px 10px;min-height:0;flex:1}
.lvh{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:12px 6px 4px;font-weight:600}
.unh{font-size:12px;font-weight:600;margin:8px 6px 2px;color:var(--ink);display:flex;justify-content:space-between}
.unh small{color:var(--muted);font-weight:400}
.room{display:flex;justify-content:space-between;gap:8px;width:100%;text-align:left;border:0;background:transparent;padding:5px 8px;border-radius:7px;cursor:pointer;font-size:13px}
.room:hover{background:var(--chip)}
.room.on{background:var(--hi)}
.room span:last-child{font-family:var(--mono);font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}

.tg{display:flex;align-items:center;gap:8px;font-size:13px;padding:4px 2px;cursor:pointer;border-radius:6px}
.tg input{accent-color:var(--accent);width:15px;height:15px;margin:0}
#card{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 16px);width:300px;max-width:calc(100% - 32px);background:var(--panel);
  border:1px solid var(--line);border-radius:12px;padding:12px 14px;z-index:6;backdrop-filter:blur(8px);box-sizing:border-box}
#card h3{margin:0 24px 2px 0;font-size:15px;line-height:1.3;text-wrap:balance}
#card .k{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
#card dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:10px 0 0;font-size:13px}
#card dt{color:var(--muted)}
#card dd{margin:0;min-width:0;overflow-wrap:anywhere}
#card .mono{font-family:var(--mono);font-size:12px;font-variant-numeric:tabular-nums}
#card .x{position:absolute;right:8px;top:8px;border:0;background:transparent;font-size:18px;cursor:pointer;color:var(--muted);width:28px;height:28px;border-radius:6px}
#pad{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 18px);display:grid;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(2,52px);gap:6px;z-index:5}
#pad button{border:1px solid var(--line);background:var(--panel);border-radius:12px;font-size:20px;cursor:pointer;touch-action:none;user-select:none;-webkit-user-select:none}
#pad button:active{background:var(--hi)}
#pad .up{grid-column:2;grid-row:1}
#pad [data-k="l"]{grid-column:1;grid-row:2} #pad [data-k="b"]{grid-column:2;grid-row:2} #pad [data-k="r"]{grid-column:3;grid-row:2}
#hint{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 70px);background:var(--panel);border:1px solid var(--line);border-radius:999px;
  padding:6px 14px;font-size:12.5px;color:var(--muted);z-index:3;white-space:nowrap;backdrop-filter:blur(8px);max-width:calc(100% - 32px);overflow:hidden;text-overflow:ellipsis}
#loading{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg);z-index:20;font-size:14px;color:var(--muted)}
#labels{position:fixed;inset:0;pointer-events:none;z-index:2;overflow:hidden}
.lb{position:absolute;transform:translate(-50%,-50%);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;font-weight:600;color:#26302a;background:rgba(255,255,255,.78);
  padding:2px 6px;border-radius:4px;white-space:nowrap}
#roomsBtn{display:none}
@media (max-width:760px){
  #panel{left:0;right:0;width:auto;top:auto;bottom:0;height:46%;border-radius:14px 14px 0 0;padding-bottom:env(safe-area-inset-bottom,0px);transform:translateY(105%);transition:transform .25s ease}
  #panel.open{transform:none}
  #roomsBtn{display:block}
  #toggles{top:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);right:max(16px,env(safe-area-inset-right,0px));padding:6px 8px}
  #toggles .tg{font-size:12px}
  #hint{display:none}
  .brand span{display:none}
  #card{bottom:calc(env(safe-area-inset-bottom,0px) + 150px)}
  body.walk #toggles,body.sheet #toggles{display:none}
}
@media (prefers-reduced-motion: reduce){#panel{transition:none}}
</style>
