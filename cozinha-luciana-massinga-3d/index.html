<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="robots" content="noindex"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Cozinha Luciana Massinga 3D</title></head><body style="margin:0"><title>Cozinha Luciana 3D</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Same layout as the Indico interactive 3D (KOV): full bleed canvas, quiet top bar, folding menu left (bottom sheet on phones), toggles right, info card */
:root{
  --bg:#eeece7; --panel:rgba(250,249,246,.94); --ink:#1f2622; --muted:#66706a; --line:#d9d6cf;
  --accent:#8a5a32; --accent-ink:#fff; --chip:#e7e4dd; --hi:#f0e3d2;
  --sans:"Figtree",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"DM Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#151513; --panel:rgba(28,28,25,.93); --ink:#ece9e3; --muted:#a29d93; --line:#37352f; --accent:#d29a63; --accent-ink:#1a120a; --chip:#2a2925; --hi:#3d3023; color-scheme:dark}}
:root[data-theme="dark"]{--bg:#151513; --panel:rgba(28,28,25,.93); --ink:#ece9e3; --muted:#a29d93; --line:#37352f; --accent:#d29a63; --accent-ink:#1a120a; --chip:#2a2925; --hi:#3d3023; color-scheme:dark}
html,body{height:100%;margin:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);overflow:hidden;font-size:14px}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
button{font:inherit;color:inherit}
.bar{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;display:flex;gap:8px;align-items:center;flex-wrap:wrap;
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none;z-index:5}
.bar>*{pointer-events:auto}
.brand{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:7px 12px;display:flex;flex-direction:column;line-height:1.15;backdrop-filter:blur(8px)}
.brand b{font-weight:700;letter-spacing:.01em;font-size:15px}
.brand span{font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px;backdrop-filter:blur(8px);flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:6px 10px;border-radius:7px;cursor:pointer;font-weight:500;font-size:13px;white-space:nowrap;display:flex;align-items:center;gap:6px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.seg button:focus-visible,.tg:focus-within,.room:focus-visible,.stop:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.dot{width:11px;height:11px;border-radius:50%;border:1px solid rgba(0,0,0,.25);flex:none}
#panel{position:fixed;left:max(16px,env(safe-area-inset-left,0px));top:calc(env(safe-area-inset-top,0px) + 70px);bottom:calc(env(safe-area-inset-bottom,0px) + 84px);width:290px;
  background:var(--panel);border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;z-index:4;backdrop-filter:blur(8px);min-height:0}
#panel header{padding:12px 12px 8px;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--line)}
#panel h2{margin:0;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;display:flex;justify-content:space-between;align-items:center}
#q{width:100%;box-sizing:border-box;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:7px 9px;font:inherit}
#list{overflow:auto;padding:4px 6px 10px;min-height:0;flex:1}
.lvh{display:flex;align-items:center;gap:7px;width:100%;text-align:left;border:0;background:transparent;cursor:pointer;color:var(--ink);font:inherit;
  font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;font-weight:650;padding:9px 8px;margin-top:4px;border-top:1px solid var(--line)}
.lvh:first-child{border-top:0;margin-top:0}
.lvh:hover{background:var(--chip)}
.lvh small{margin-left:auto;color:var(--muted);font-weight:400;font-family:var(--mono);font-size:11px;letter-spacing:0;text-transform:none}
.chev{flex:none;width:9px;height:9px;border-right:1.6px solid currentColor;border-bottom:1.6px solid currentColor;transform:rotate(-45deg);transition:transform .15s ease;opacity:.7;margin-right:2px}
[aria-expanded="true"]>.chev{transform:rotate(45deg)}
.grp .room{padding-left:24px}
.hbtns{display:flex;gap:6px;align-items:center}
#minBtn,#allBtn{white-space:nowrap;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:6px;font-size:11px;letter-spacing:0;text-transform:none;padding:2px 7px;cursor:pointer}
#panel.min{bottom:auto}
#panel.min #q,#panel.min #list,#panel.min #allBtn{display:none}
#panel.min header{border-bottom:0}
.room{display:flex;justify-content:space-between;gap:8px;width:100%;text-align:left;border:0;background:transparent;padding:5px 8px;border-radius:7px;cursor:pointer;font-size:13px}
.room:hover{background:var(--chip)}
.room.on{background:var(--hi)}
.room span:last-child{font-family:var(--mono);font-size:11px;color:var(--muted);white-space:nowrap}
#toggles{position:fixed;right:max(16px,env(safe-area-inset-right,0px));top:calc(env(safe-area-inset-top,0px) + 70px);background:var(--panel);border:1px solid var(--line);border-radius:12px;
  padding:8px 10px;display:flex;flex-direction:column;gap:2px;z-index:4;backdrop-filter:blur(8px)}
.tg{display:flex;align-items:center;gap:8px;font-size:13px;padding:4px 2px;cursor:pointer;border-radius:6px}
.tg input{accent-color:var(--accent);width:15px;height:15px;margin:0}
#card{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 84px);width:310px;max-width:calc(100% - 32px);background:var(--panel);
  border:1px solid var(--line);border-radius:12px;padding:12px 14px;z-index:6;backdrop-filter:blur(8px);box-sizing:border-box}
#card h3{margin:0 24px 2px 0;font-size:15px;line-height:1.3;text-wrap:balance}
#card .k{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
#card p{margin:8px 0 0;font-size:13px;line-height:1.45}
#card dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:10px 0 0;font-size:13px}
#card dt{color:var(--muted)}
#card dd{margin:0;font-family:var(--mono);font-size:12px}
#card .x{position:absolute;right:8px;top:8px;border:0;background:transparent;font-size:18px;cursor:pointer;color:var(--muted);width:28px;height:28px;border-radius:6px}
#stops{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);display:flex;gap:6px;overflow-x:auto;padding:4px max(16px,env(safe-area-inset-left,0px));z-index:5;
  scrollbar-width:none;justify-content:safe center}
#stops::-webkit-scrollbar{display:none}
.stop{flex:none;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:8px 13px;font-size:13px;cursor:pointer;backdrop-filter:blur(8px);white-space:nowrap}
.stop b{font-family:var(--mono);font-weight:500;color:var(--muted);margin-right:5px;font-size:11.5px}
.stop[aria-current="true"]{border-color:var(--accent);background:var(--hi)}
#pad{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 72px);display:grid;grid-template-columns:repeat(3,50px);grid-template-rows:repeat(2,50px);gap:6px;z-index:5}
#pad button{border:1px solid var(--line);background:var(--panel);border-radius:12px;font-size:19px;cursor:pointer;touch-action:none;user-select:none;-webkit-user-select:none}
#pad button:active{background:var(--hi)}
#pad .up{grid-column:2;grid-row:1}
#pad [data-k="l"]{grid-column:1;grid-row:2} #pad [data-k="b"]{grid-column:2;grid-row:2} #pad [data-k="r"]{grid-column:3;grid-row:2}
#hint{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 70px);background:var(--panel);border:1px solid var(--line);border-radius:999px;
  padding:6px 14px;font-size:12.5px;color:var(--muted);z-index:3;white-space:nowrap;backdrop-filter:blur(8px);max-width:calc(100% - 660px);overflow:hidden;text-overflow:ellipsis}
#loading{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg);z-index:20;font-size:14px;color:var(--muted);text-align:center;padding:16px}
#labels{position:fixed;inset:0;pointer-events:none;z-index:2;overflow:hidden}
.lb{position:absolute;transform:translate(-50%,-50%);font-size:10px;letter-spacing:.05em;text-transform:uppercase;font-weight:600;color:#26302a;background:rgba(255,255,255,.82);
  padding:2px 6px;border-radius:4px;white-space:nowrap}
#menuBtn{display:none}
@media (max-width:760px){
  #panel{left:0;right:0;width:auto;top:auto;bottom:0;height:55%;border-radius:14px 14px 0 0;padding-bottom:env(safe-area-inset-bottom,0px);transform:translateY(105%);transition:transform .25s ease;z-index:7}
  #panel.open{transform:none}
  #menuBtn{display:flex}
  #toggles{display:none}
  #panel #toggles{display:flex;position:static;border:0;border-top:1px solid var(--line);border-radius:0;background:transparent;flex-direction:row;flex-wrap:wrap;gap:4px 14px;padding:8px 12px}
  #hint{display:none}
  .brand span{display:none}
  #card{bottom:calc(env(safe-area-inset-bottom,0px) + 70px)}
  body.walk #card{bottom:calc(env(safe-area-inset-bottom,0px) + 190px)}
  #minBtn{display:none}
}
@media (max-width:1100px){#hint{display:none}}
@media (prefers-reduced-motion: reduce){#panel,.chev{transition:none}}
</style>

</div>

    if (f || s || turn){
      const sp = (keys.has("shift") ? 2.4 : 1.2) * dt; walk.yaw += turn * 1.5 * dt;
      tryMove((-Math.sin(walk.yaw) * f + Math.cos(walk.yaw) * s) * sp, (-Math.cos(walk.yaw) * f - Math.sin(walk.yaw) * s) * sp);
      needs = true; fly = null;
    }
    applyWalk();
  } else applyOrbit();
  if (needs){ if (state.mode === "orbit") updateOcclusion(); renderer.render(scene, camera); renderLabels(); needs = !!fly; }
}

// ---------------------------------------------------------------- boot
function boot(){
  const t0 = performance.now();
  buildPieces(); buildLights();
  const stopsEl = document.getElementById("stops");
  S.stops.forEach((s, i) => { const b = document.createElement("button"); b.className = "stop"; b.innerHTML = `<b>${String(i + 1).padStart(2, "0")}</b>${esc(s.n)}`; b.onclick = () => goStop(i); stopsEl.appendChild(b); });
  if (innerWidth <= 760) panel.appendChild(toggles);
  document.getElementById("tShadow").checked = state.shadow;
  buildList(); resize(); setStone("A"); applyVis(); applyOrbit();
  const done = () => { document.getElementById("loading").remove(); needs = true; };
  if (S.stoneA){
    const img = new Image();
    img.onload = () => { const t = new THREE.Texture(img); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.encoding = THREE.sRGBEncoding; t.anisotropy = 8; t.needsUpdate = true; TX.stoneA = t; setStone(state.opt); done(); };
    img.onerror = done; img.src = S.stoneA;
  } else done();
  let tris = 0; meshes.forEach(o => tris += (o.geometry.index ? o.geometry.index.count : o.geometry.attributes.position.count) / 3);
  window.KIT = {S, state, meshes, orbit, walk, camera, setMode, goStop, setStone, showPiece, focusItem, render: () => { needs = true; },
    stats: {meshes: meshes.length, tris: Math.round(tris), pieces: S.pieces.length, items: ITEMS.length, buildMs: Math.round(performance.now() - t0)}};
  requestAnimationFrame(loop);
}
setTimeout(boot, 30);
})();
</script>
